<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Two-Person Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root {
  --bg: #eef2f5; --surface: #ffffff; --fg: #1b2733; --muted: #637282; --line: #d6dee5;
  --mine: #1f5f73; --mine-fg: #f3fbfd; --theirs: #ffffff; --accent: #1f5f73;
  --font-display: "Gloock", Georgia, serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --surface: #17222a; --fg: #e4ecf1; --muted: #8b9aa6; --line: #26343e;
    --mine: #3c8fa6; --mine-fg: #06161c; --theirs: #1c2a33; --accent: #6fbfd4;
  }
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px;
  display: flex; flex-direction: column;
}
header {
  padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; }
.status { font-size: .8rem; color: var(--muted); }
.sub { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--muted); min-height: 1.4em; }
#presence.on { color: var(--accent); font-weight: 600; }
#log {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
  width: 100%; max-width: 720px; margin: 0 auto; box-sizing: border-box;
}
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 30ch; line-height: 1.5; }
.empty strong, .auth strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; color: var(--fg); margin-bottom: 4px; }
.auth { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: var(--muted); }
.day { align-self: center; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.msg { max-width: 78%; display: flex; flex-direction: column; gap: 2px; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; }
.who { font-size: .72rem; color: var(--muted); padding: 0 6px; }
.bubble { padding: 9px 13px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.mine .bubble { background: var(--mine); color: var(--mine-fg); border-bottom-right-radius: 6px; }
.theirs .bubble { background: var(--theirs); color: var(--fg); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.pending .bubble { opacity: .6; }
.bubble.media { padding: 4px; }
.bubble.media img { display: block; max-width: 100%; max-height: 320px; border-radius: 14px; cursor: zoom-in; }
.bubble audio { display: block; max-width: 100%; height: 40px; }
.msg .bubble.sticker { background: none !important; border: 0 !important; font-size: 3.2rem; line-height: 1.1; padding: 2px 6px; }
.tools { display: flex; }
.icon { width: 36px; height: 40px; padding: 0; font-size: 1.2rem; background: none; color: var(--fg); border-radius: 50%; }
#stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--line); }
#stickers button { background: none; font-size: 2rem; padding: 4px 0; border-radius: 12px; }
#recbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
#recbar .dot { color: #e5484d; }
#recbar .grow { flex: 1; font-variant-numeric: tabular-nums; }
#recbar #recsend { padding: 9px 18px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; z-index: 10; }
#lightbox img { max-width: 100%; max-height: 100%; }
.time { font-size: .68rem; color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
form {
  display: flex; gap: 8px; padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); background: var(--surface);
}
textarea {
  flex: 1; min-width: 0; resize: none; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; max-height: 120px;
}
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 20px; padding: 0 18px;
  background: var(--accent); color: var(--surface); cursor: pointer;
}
button:disabled { opacity: .45; cursor: default; }
.auth button { padding: 11px 22px; }
button.link { background: none; color: var(--accent); padding: 0 4px; font-size: .8rem; font-weight: 600; }
.note { text-align: center; font-size: .8rem; color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Two-Person Chat</h1>
    <div class="sub" id="subrow" hidden><span id="presence"></span><button class="link" id="rcpt" type="button"></button></div>
  </div>
  <span><span class="status" id="status">Connecting…</span> <button class="link" id="signout" hidden>Sign out</button></span>
</header>

<div class="auth" id="auth" hidden>
  <div><strong>Sign in to chat</strong>Use the Google account that has been given access.</div>
  <button id="signin">Sign in with Google</button>
  <div id="autherr" role="alert"></div>
</div>

<div id="log" aria-live="polite" hidden>
  <div class="empty" id="empty"><strong>No messages yet</strong>Type below to say hi. Your friend will see it when they open this page.</div>
</div>

<div id="stickers" hidden></div>
<div id="recbar" hidden><span class="dot">●</span><span class="grow" id="rectime">0:00</span><button type="button" class="link" id="reccancel">Cancel</button><button type="button" id="recsend">Send</button></div>
<form id="composer" hidden>
  <div class="tools">
    <button type="button" class="icon" id="photo" aria-label="Send photo">📷</button>
    <button type="button" class="icon" id="stick" aria-label="Stickers">😊</button>
    <button type="button" class="icon" id="mic" aria-label="Voice note">🎤</button>
  </div>
  <textarea id="text" rows="1" placeholder="Message" aria-label="Message" maxlength="4000"></textarea>
  <button type="submit" id="send" disabled>Send</button>
</form>
<input type="file" id="pick" accept="image/*" hidden>
<div id="lightbox" hidden><img alt=""></div>
<div class="note" id="denied" hidden>This account isn't allowed in this chat. Sign out and use the Google account that was given access.</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Paste your Firebase web-app config here (Project settings → Your apps).
// These values are safe to publish; access is controlled by firestore.rules.
const firebaseConfig = {
  apiKey: "AIzaSyBSR_MpUaYvvgQLqbc6jKzleLCLu-cWRSA",
  authDomain: "two-person-chat-3f498.firebaseapp.com",
  projectId: "two-person-chat-3f498",
  storageBucket: "two-person-chat-3f498.firebasestorage.app",
  messagingSenderId: "976377057244",
  appId: "1:976377057244:web:a64d4e75e66fbf91740919"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// The database ID shown in Firebase console → Firestore → Data. Use '(default)' if it shows that.
const DB_ID = 'default';
const db = getFirestore(app, DB_ID);
const messages = collection(db, 'messages');
const statuses = collection(db, 'status');

const $ = id => document.getElementById(id);
const log = $('log'), emptyEl = $('empty'), statusEl = $('status'), form = $('composer'),
      textEl = $('text'), sendBtn = $('send'), authEl = $('auth'), deniedEl = $('denied'), signoutBtn = $('signout');
let me = null, unsub = null, unsubStatus = null, friend = null, newestTs = null, lastDocs = null, sentDelivered = 0, sentRead = 0, renderLater = false;

function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtDay(ms) {
  const d = new Date(ms), t = new Date();
  const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

// Synchronous, so a stale render can never overwrite a newer one.
function render(docs) {
  const msgs = docs
    .map(d => ({ ...d.data({ serverTimestamps: 'estimate' }), pending: d.metadata.hasPendingWrites }))
    .filter(m => typeof m.text === 'string' && m.ts && m.ts.toMillis)
    .reverse();
  lastDocs = docs;
  const latest = msgs.filter(m => !m.pending).pop();
  newestTs = latest && latest.uid !== (me && me.uid) ? latest.ts : null;
  markSeen();
  if ([...log.querySelectorAll('audio')].some(a => !a.paused)) { renderLater = true; return; }
  const first = !render.done;
  const prevTop = log.scrollTop;
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.replaceChildren();
  if (!msgs.length) { log.append(emptyEl); return; }
  let lastDay = '', lastUid = null;
  for (const m of msgs) {
    const ms = m.ts.toMillis();
    const day = fmtDay(ms);
    if (day !== lastDay) {
      const el = document.createElement('div'); el.className = 'day'; el.textContent = day; log.append(el);
      lastDay = day; lastUid = null;
    }
    const mine = me && m.uid === me.uid;
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (mine ? 'mine' : 'theirs') + (m.pending ? ' pending' : '');
    if (!mine && m.uid !== lastUid) {
      const who = document.createElement('div'); who.className = 'who'; who.textContent = m.name || 'Friend'; wrap.append(who);
    }
    const b = document.createElement('div'); b.className = 'bubble';
    if (m.kind === 'image' && m.media) {
      b.classList.add('media');
      const im = document.createElement('img'); im.src = m.media; im.alt = 'Photo';
      im.onload = () => { if (nearBottom || first) log.scrollTop = log.scrollHeight; };
      im.onclick = () => { lb.querySelector('img').src = m.media; lb.hidden = false; };
      b.append(im);
    } else if (m.kind === 'voice' && m.media) {
      const a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; a.src = m.media;
      a.addEventListener('pause', () => { if (renderLater) { renderLater = false; render(lastDocs); } });
      b.append(a);
    } else if (m.kind === 'sticker') { b.classList.add('sticker'); b.textContent = m.text; }
    else b.textContent = m.text;
    const t = document.createElement('div'); t.className = 'time'; t.textContent = fmtTime(ms) + (mine ? ' · ' + tickFor(m, ms) : '');
    wrap.append(b, t); log.append(wrap);
    lastUid = m.uid;
  }
  // Stick to the bottom only if already there; otherwise keep the reader's place
  log.scrollTop = (nearBottom || first) ? log.scrollHeight : prevTop;
  render.done = true;
}

function resize() { textEl.style.height = 'auto'; textEl.style.height = Math.min(textEl.scrollHeight, 120) + 'px'; }
function updateSend() { sendBtn.disabled = !me || !textEl.value.trim(); }
textEl.addEventListener('input', () => { resize(); updateSend(); });

// Enter sends only with a mouse/physical keyboard; on touch screens it inserts a newline
const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
textEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && finePointer.matches) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = textEl.value.trim();
  if (!text || !me) return;
  textEl.value = ''; resize(); updateSend();
  const slow = setTimeout(() => { statusEl.textContent = "Not saved yet — can't reach the database"; }, 8000);
  try {
    await addDoc(messages, { text, uid: me.uid, name: me.displayName || 'Friend', ts: serverTimestamp() });
    clearTimeout(slow);
    statusEl.textContent = 'Live';
  } catch (err) {
    clearTimeout(slow);
    // Never lose the draft: put it back, ahead of anything typed since
    textEl.value = textEl.value ? text + '\n' + textEl.value : text;
    resize();
    statusEl.textContent = (err && err.code === 'permission-denied') ? 'Not allowed to post' : 'Message not sent (' + ((err && err.code) || 'error') + ')';
    updateSend();
  }
});

$('signin').addEventListener('click', async () => {
  $('autherr').textContent = '';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (err) {
    const quiet = err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request');
    if (!quiet) $('autherr').textContent = 'Sign-in failed. Check the popup wasn\'t blocked and try again.';
  }
});
signoutBtn.addEventListener('click', () => signOut(auth));

// ---- Presence, delivered and read ----
let showRead = true;
try { showRead = localStorage.getItem('showRead') !== 'off'; } catch (e) {}
const rcptBtn = $('rcpt');
function drawRcpt() { rcptBtn.textContent = 'Read receipts: ' + (showRead ? 'on' : 'off'); }
rcptBtn.addEventListener('click', () => {
  showRead = !showRead;
  try { localStorage.setItem('showRead', showRead ? 'on' : 'off'); } catch (e) {}
  drawRcpt(); markSeen();
});
drawRcpt();

const tsMs = t => (t && t.toMillis ? t.toMillis() : 0);
const rcptKey = f => (f ? tsMs(f.readTs) + '|' + tsMs(f.deliveredTs) : '');

function touch(extra) {
  if (!me) return;
  setDoc(doc(db, 'status', me.uid),
    { name: me.displayName || 'Friend', lastActive: serverTimestamp(), ...extra },
    { merge: true }).catch(() => {});
}

// Tell the other person's page what this page has received and, if on, read.
function markSeen() {
  if (!me || !newestTs) return;
  const ms = tsMs(newestTs), extra = {};
  if (ms > sentDelivered) { extra.deliveredTs = newestTs; sentDelivered = ms; }
  if (showRead && document.visibilityState === 'visible' && document.hasFocus() && ms > sentRead) {
    extra.readTs = newestTs; sentRead = ms;
  }
  if (Object.keys(extra).length) touch(extra);
}

function tickFor(m, ms) {
  if (m.pending) return 'Sending…';
  const rd = friend ? tsMs(friend.readTs) : 0, dl = friend ? tsMs(friend.deliveredTs) : 0;
  if (rd && ms <= rd) return '✓✓ Read';
  if (dl && ms <= dl) return '✓✓ Delivered';
  return '✓ Sent';
}

function drawPresence() {
  const el = $('presence');
  const la = friend ? tsMs(friend.lastActive) : 0;
  const online = !!la && Date.now() - la < 75000;
  el.classList.toggle('on', online);
  el.textContent = !la ? '' : online ? 'Online' : 'Last seen ' + fmtDay(la) + ', ' + fmtTime(la);
}

// Heartbeat while the page is visible; browsers pause hidden tabs, so "online" can lag.
setInterval(() => { if (document.visibilityState === 'visible') touch(); drawPresence(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { touch(); markSeen(); } });
window.addEventListener('focus', markSeen);

// ---- Photos, stickers, voice notes (stored inside the message, so no Storage plan needed) ----
const lb = $('lightbox');
lb.addEventListener('click', () => { lb.hidden = true; });

async function sendMedia(kind, media, text, dur) {
  if (!me) return;
  const data = { text, uid: me.uid, name: me.displayName || 'Friend', ts: serverTimestamp(), kind };
  if (media) data.media = media;
  if (dur) data.dur = dur;
  try { await addDoc(messages, data); statusEl.textContent = 'Live'; }
  catch (err) { statusEl.textContent = 'Not sent (' + ((err && err.code) || 'error') + ')'; }
}

const STICKERS = ['😂','❤️','😍','🥹','😭','😎','🤝','🙏','👍','🔥','🎉','😴','🤔','😅','🥰','😘','🙌','💪','🤗','😤','🫶','✨','🍕','☕'];
const stickersEl = $('stickers');
STICKERS.forEach(st => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = st;
  b.addEventListener('click', () => { stickersEl.hidden = true; sendMedia('sticker', null, st); });
  stickersEl.append(b);
});
$('stick').addEventListener('click', () => { stickersEl.hidden = !stickersEl.hidden; });

async function shrinkImage(file) {
  const img = await createImageBitmap(file);
  let scale = Math.min(1, 1000 / Math.max(img.width, img.height)), q = 0.7;
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length < 350000) return url;
    scale *= 0.8; q = Math.max(0.4, q - 0.07);
  }
  throw new Error('too-big');
}
$('photo').addEventListener('click', () => $('pick').click());
$('pick').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  statusEl.textContent = 'Sending photo…';
  try { sendMedia('image', await shrinkImage(file), '📷 Photo'); }
  catch (err) { statusEl.textContent = "Couldn't use that photo"; }
});

let rec = null, recChunks = [], recStart = 0, recTimer = null, recSend = false;
const fmtDur = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
const toDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
function recUI(on) { $('recbar').hidden = !on; form.hidden = on || !me || !deniedEl.hidden; }
function stopRec(send) { if (rec && rec.state === 'recording') { recSend = send; rec.stop(); } }

$('mic').addEventListener('click', async () => {
  if (rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
    recChunks = []; recSend = false;
    rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer);
      const mime = rec.mimeType, secs = Math.max(1, Math.round((Date.now() - recStart) / 1000));
      rec = null; recUI(false);
      if (!recSend || !recChunks.length) return;
      try {
        const url = await toDataUrl(new Blob(recChunks, { type: mime }));
        if (url.length > 800000) { statusEl.textContent = 'Voice note too long'; return; }
        sendMedia('voice', url, '🎤 Voice note', secs);
      } catch (err) { statusEl.textContent = "Couldn't send voice note"; }
    };
    rec.start(); recStart = Date.now(); $('rectime').textContent = '0:00'; recUI(true);
    recTimer = setInterval(() => {
      const n = Math.round((Date.now() - recStart) / 1000);
      $('rectime').textContent = fmtDur(n);
      if (n >= 90) stopRec(true);
    }, 500);
  } catch (err) { rec = null; statusEl.textContent = 'Microphone not available'; }
});
$('recsend').addEventListener('click', () => stopRec(true));
$('reccancel').addEventListener('click', () => stopRec(false));

onAuthStateChanged(auth, u => {
  me = u;
  if (unsub) { unsub(); unsub = null; }
  if (unsubStatus) { unsubStatus(); unsubStatus = null; }
  friend = null; lastDocs = null; newestTs = null; sentDelivered = 0; sentRead = 0;
  $('subrow').hidden = !u; drawPresence(); $('stickers').hidden = true;
  render.done = false;
  deniedEl.hidden = true;
  authEl.hidden = !!u; log.hidden = !u; form.hidden = !u; signoutBtn.hidden = !u;
  if (!u) { statusEl.textContent = 'Signed out'; return; }
  statusEl.textContent = 'Connecting…';
  updateSend();
  unsubStatus = onSnapshot(statuses, snap => {
    const before = rcptKey(friend);
    friend = null;
    snap.forEach(d => { if (me && d.id !== me.uid) friend = d.data(); });
    drawPresence();
    if (before !== rcptKey(friend) && lastDocs) render(lastDocs);
  }, () => {});
  touch();
  unsub = onSnapshot(
    query(messages, orderBy('ts', 'desc'), limit(100)),
    { includeMetadataChanges: true },
    snap => { statusEl.textContent = snap.metadata.fromCache ? 'Connecting…' : 'Live'; render(snap.docs); },
    err => {
      if (err && err.code === 'permission-denied') { form.hidden = true; log.hidden = true; deniedEl.hidden = false; statusEl.textContent = 'Access denied'; }
      else statusEl.textContent = 'Disconnected (' + ((err && err.code) || 'error') + ')';
    }
  );
});
</script>
</body>
</html>
